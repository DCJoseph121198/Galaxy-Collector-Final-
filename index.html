<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Collector</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header> 
        <h1>Galaxy Collector</h1>
        <p>Collect stars and avoid asteroids to earn the highest score!</p>
    </header>

    <main>

        <section id="instructions">
            <h2>How to Play</h2>
            <p>Use the Left and Right Arrow keys to move your spaceship.</p>
            <p>Collect the falling stars while avoiding asteroids.</p>
        </section>

   <section id="scoreboard">
    <h2>Score: <span id="score">0</span></h2>
    <h2>Lives: <span id="lives">3</span></h2>
   </section>

<section id="game-area">
    
</section>

<button id="startButton">Start Game</button>

</main>

<script src="script.js"></script>

</body>
</html>
